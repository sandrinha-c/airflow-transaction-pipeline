# Airflow 2.x runtime: LocalExecutor + PostgreSQL metadata DB. Startup steps: see README.

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    # Single-node assignment workload; no Celery/Redis needed
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Avoid unintended catchup runs when the DAG is first deployed
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Source system and schedule are defined in UTC+8
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Taipei
    PYTHONPATH: /opt/airflow
    PIPELINE_DATA_DIR: /opt/airflow/data
    PIPELINE_CONFIG_PATH: /opt/airflow/config/data_rules.yaml
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./sample_data:/opt/airflow/sample_data:ro
    - ./logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  # One-off: migrate metadata DB and create the admin user, then exit
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db:
